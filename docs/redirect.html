<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>即将离开 超级课程表</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      background: #f6f7fb;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f1117; color: #b6c2d6; }
      .card { background: #161a24; border-color: #272e40; }
      h1 { color: #f1f5f9; }
      .url { background: #1a1f2c; border-color: #272e40; color: #818cf8; }
      .btn-secondary { background: #1a1f2c; color: #94a3b8; }
      .btn-secondary:hover { background: #272e40; }
      .warning { color: #7c8aa0; }
    }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
      max-width: 520px;
      width: 100%;
      padding: 40px;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      border-radius: 18px;
      background: rgba(79, 70, 229, 0.08);
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #0f172a;
    }
    p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.7;
      margin-bottom: 24px;
    }
    .url {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 13px;
      color: #4f46e5;
      word-break: break-all;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      padding: 9px 30px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.15s ease;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: #4f46e5;
      color: #fff;
    }
    .btn-primary:hover {
      background: #4338ca;
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #64748b;
      margin-left: 12px;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    .warning {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#x1F517;</div>
    <h1>即将离开 超级课程表</h1>
    <p>你即将访问外部链接，请注意信息安全。该链接不在我们的控制范围内，请谨慎操作。</p>
    <div class="url" id="target-url"></div>
    <div>
      <a class="btn btn-primary" id="confirm-btn">继续访问</a>
      <a class="btn btn-secondary" onclick="window.close(); history.back();">返回</a>
    </div>
    <div class="warning">请注意：外部链接可能存在安全风险，请确认链接地址无误后再访问。</div>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var target = params.get('url');
    if (target) {
      document.getElementById('target-url').textContent = target;
      var btn = document.getElementById('confirm-btn');
      btn.href = target;
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        window.location.href = target;
      });
    } else {
      document.getElementById('target-url').textContent = '未提供链接地址';
      document.getElementById('confirm-btn').style.display = 'none';
    }
  </script>
</body>
</html>
